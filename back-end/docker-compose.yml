services:
  gateway:
    build: ./gateway
    env_file:
      - ./gateway/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  
  auth-service:
    build: ./auth
    env_file:
      - ./auth/.env.docker
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  account-service:
    build: ./account
    env_file:
      - ./account/.env.docker
    depends_on:
      account-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  chat-service:
    build: ./chat
    env_file:
      - ./chat/.env.docker
    depends_on:
      chat-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1)) \" "]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
  
  auth-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME_AUTH}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_AUTH}"]
      interval: 5s
      timeout: 5s
      retries: 5

  account-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME_ACCOUNT}
    volumes:
      - account_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_ACCOUNT}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  chat-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME_CHAT}
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_CHAT}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_db_data:
  account_db_data:
  chat_db_data: